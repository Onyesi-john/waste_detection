version: 2.1

jobs:
  clone_repository:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout  # Clones your repository

  setup_python_environment:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - run:
          name: Set Up Python Environment
          command: |
            apt-get update && apt-get install -y python3-venv
            python3 -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
      - persist_to_workspace:
          root: .
          paths:
            - .  # Persist the entire workspace

  build_and_push_docker_image:
    docker:
      - image: docker:latest
    steps:
      - attach_workspace:
          at: /workspace
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Move Best Model to Docker Build Context
          command: |
            # Move best.pt to a known location for Docker build
            mkdir -p /workspace/docker_model
            cp /workspace/yolov5/runs/train/exp/weights/best.pt /workspace/docker_model/best.pt
      - run:
          name: Set up Buildx
          command: |
            docker run --privileged --rm tonistiigi/binfmt --install all
            docker buildx create --use
            docker buildx inspect --bootstrap
      - run:
          name: Build and Push Docker Image
          command: |
            docker buildx build --platform linux/arm/v7,linux/arm64 --push -t $DOCKERHUB_USERNAME/waste_detection:latest .

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - clone_repository
      - setup_python_environment:
          requires:
            - clone_repository
      - build_and_push_docker_image:
          requires:
            - setup_python_environment
