version: 2.1

jobs:
  clone_repository:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout

  setup_python_environment:
    docker:
      - image: cimg/python:3.9  
    steps:
      - checkout
      - run:
          name: Set Up Python Environment
          command: |
            apt-get update && apt-get install -y python3-venv
            python3 -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
      - persist_to_workspace:
          root: ~/project
          paths:
            - .  # Persist the entire workspace

  prepare_model:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - run:
          name: Copy Best Model to Docker Build Context
          command: |
            # Ensure the directory for the model exists
            mkdir -p ~/project/docker_model
            # Copy the best model from yolov5 runs directory
            cp ~/project/yolov5/runs/train/exp/weights/best.pt ~/project/docker_model/ || { echo "best.pt not found"; exit 1; }

  build_and_push_docker_image:
    docker:
      - image: docker:latest
    steps:
      - checkout
      - attach_workspace:
          at: ~/project
      - setup_remote_docker:
          version: 20.10.7  # Adjust the version if needed
      - run:
          name: Build Docker Image with Buildx
          command: |
            # Build the Docker image using buildx
            docker buildx build --platform linux/arm/v7 -t $DOCKERHUB_USERNAME/waste_detection:latest --push .

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - clone_repository
      - setup_python_environment:
          requires:
            - clone_repository
      - prepare_model:
          requires:
            - setup_python_environment
      - build_and_push_docker_image:
          requires:
            - prepare_model
