version: 2.1

jobs:
  clone_repository:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

  setup_python_environment:
    docker:
      - image: cimg/python:3.9
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Install System Dependencies
          command: |
            apt-get update && apt-get install -y \
            libgl1-mesa-glx \
            libglib2.0-0 \
            ffmpeg \
            libsm6 \
            libxext6 \
            libxrender1
      - run:
          name: Set Up Python Environment
          command: |
            python3 -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
      - persist_to_workspace:
          root: ~/project
          paths:
            - .
            - venv  # Persist venv

  train_model:
    docker:
      - image: cimg/python:3.9
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Train Model
          command: |
            . venv/bin/activate
            python train.py
      - persist_to_workspace:
          root: ~/project
          paths:
            - best.pt

  build_and_push_docker_image:
    docker:
      - image: docker:latest
    steps:
      - attach_workspace:
          at: ~/project
      - setup_remote_docker:
          version: 20.10.7
          docker_layer_caching: true
      - run:
          name: Authenticate with Docker Hub
          command: |
            echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run:
          name: Build and Push Docker Image
          command: |
            DOCKER_USER=${DOCKERHUB_USERNAME:-"defaultuser"}
            IMAGE_NAME="$DOCKER_USER/waste_detection:latest"
            docker buildx build --platform linux/arm64,linux/amd64 -t $IMAGE_NAME .
            docker push $IMAGE_NAME

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - clone_repository
      - setup_python_environment:
          requires:
            - clone_repository
      - train_model:
          requires:
            - setup_python_environment
      - build_and_push_docker_image:
          requires:
            - train_model
