version: 2.1

executors:
  arm_executor:
    machine: true  # Enables privileged mode for QEMU multi-arch builds

jobs:
  clone_repository:
    docker:
      - image: cimg/python:3.9  # Use CircleCI’s Python image for AMD64 compatibility
    steps:
      - checkout

  setup_python_environment:
    docker:
      - image: cimg/python:3.9  # Use official CircleCI Python image (ARM64 not needed here)
    steps:
      - checkout
      - run:
          name: Set Up Python Environment
          command: |
            python3 -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

  train_model:
    docker:
      - image: cimg/python:3.9  # Use same Python image for consistency
    steps:
      - checkout
      - attach_workspace:
          at: ~/project
      - run:
          name: Install Python Dependencies
          command: |
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
      - run:
          name: Train Model
          command: |
            . venv/bin/activate
            python train.py

            # Debugging: Ensure best.pt exists
            ls -l runs/detect/train/weights/

            # Move best.pt to root directory
            mv runs/detect/train/weights/best.pt ./best.pt || { echo "Error: best.pt not found!"; exit 1; }

            # Verify best.pt is in root
            if [ -f "./best.pt" ]; then
              echo "✅ best.pt successfully moved!"
            else
              echo "❌ Error: best.pt missing!"
              exit 1
            fi
      - persist_to_workspace:
          root: ~/project
          paths:
            - best.pt

  build_and_push_docker_image:
    executor: arm_executor
    steps:
      - checkout
      - attach_workspace:
          at: ~/project
      - setup_remote_docker
      - run:
          name: Enable QEMU for Multi-Arch Builds
          command: |
            docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
      - run:
          name: Authenticate with Docker Hub
          command: |
            echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run:
          name: Build and Push Multi-Arch Docker Image
          command: |
            docker buildx create --use
            docker buildx build --platform linux/amd64,linux/arm64 \
              -t $DOCKERHUB_USERNAME/waste_detection:latest --push .

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - clone_repository
      - setup_python_environment:
          requires:
            - clone_repository
      - train_model:
          requires:
            - setup_python_environment
      - build_and_push_docker_image:
          requires:
            - train_model
