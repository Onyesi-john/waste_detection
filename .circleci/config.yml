version: 2.1

jobs:
  clone_repository:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout

  setup_python_environment:
    docker:
      - image: cimg/python:3.9  
    steps:
      - checkout
      
      - run:
          name: Set Up Python Environment
          command: |
            apt-get update && apt-get install -y python3-venv  
            python3 -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

      - persist_to_workspace:
          root: .
          paths:
            - waste_detection  # Persist the whole repository

  train_model:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - attach_workspace:
          at: .
     
      - run:
          name: Train Model
          command: |
            . venv/bin/activate
            python train.py --data data.yaml --weights yolov5s.pt --epochs 50

      - run:
          name: Ensure Best Model Exists
          command: |
            if [ ! -f runs/train/exp/weights/best.pt ]; then
              echo "Training failed: best.pt not found!"
              exit 1
            fi

      - persist_to_workspace:
          root: .
          paths:
            - runs/train/exp/weights/best.pt  # Persist only the model

  build_and_push_docker_image:
    docker:
      - image: docker:latest  
    steps:
      - checkout
      - attach_workspace:
          at: .
      - setup_remote_docker
      - run:
          name: Authenticate with Docker Hub
          command: |
            echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin 2>/dev/null || { echo "Docker login failed!"; exit 1; }
      - run:
          name: Move Best Model to Docker Build Context
          command: |
            mkdir -p docker_model
            cp runs/train/exp/weights/best.pt docker_model/  # Copy only best.pt

      - run:
          name: Build and Push Docker Image
          command: |
            docker build -t $DOCKERHUB_USERNAME/waste_detection:latest .
            docker push $DOCKERHUB_USERNAME/waste_detection:latest

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - clone_repository
      - setup_python_environment:
          requires:
            - clone_repository
      - train_model:
          requires:
            - setup_python_environment
      - build_and_push_docker_image:
          requires:
            - train_model
