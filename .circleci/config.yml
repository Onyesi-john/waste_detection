version: 2.1

jobs:
  clone_repository:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout

  setup_python_environment:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - run:
          name: Set Up Python Environment
          command: |
            python3 -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

  train_model:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - attach_workspace:
          at: ~/project
      - run:
          name: Train Model
          command: |
            . venv/bin/activate
            python train.py

            # Debug: List files in the runs/detect/train directory
            ls -l runs/detect/train

            # Move best.pt to the root directory
            mv runs/detect/train/weights/best.pt ./best.pt || { echo "❌ Error: best.pt not found!"; exit 1; }

            # Debug: Verify best.pt exists in the root directory
            if [ -f "./best.pt" ]; then
              echo "✅ best.pt found in the root directory!"
            else
              echo "❌ Error: best.pt not found in the root directory!"
              exit 1
            fi
      - persist_to_workspace:
          root: ~/project
          paths:
            - best.pt

  build_and_push_docker_image:  # 🔹 This was incorrectly indented before
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - attach_workspace:
          at: ~/project
      - setup_remote_docker
      - run:
          name: Verify Model File
          command: |
            if [ ! -f "./best.pt" ]; then
              echo "❌ Error: best.pt not found after training!"
              exit 1
            fi
      - run:
          name: Build and Push Docker Image
          command: |
            # Authenticate with Docker Hub
            echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin || { echo "❌ Docker login failed!"; exit 1; }

            # Build the Docker image
            docker build -t $DOCKERHUB_USERNAME/waste_detection:latest . || { echo "❌ Docker build failed!"; exit 1; }

            # Verify the image was built
            docker images

            # Push the Docker image to Docker Hub
            docker push $DOCKERHUB_USERNAME/waste_detection:latest || { echo "❌ Docker push failed!"; exit 1; }

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - clone_repository
      - setup_python_environment:
          requires:
            - clone_repository
      - train_model:
          requires:
            - setup_python_environment
      - build_and_push_docker_image:
          requires:
            - train_model
