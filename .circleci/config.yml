version: 2.1

executors:
  docker-executor:
    machine:
      image: ubuntu-2204:current  # Use a full Ubuntu machine for Docker Buildx compatibility

jobs:
  clone_repository:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout

  setup_python_environment:
    docker:
      - image: cimg/python:3.9  
    steps:
      - checkout
      - run:
          name: Set Up Python Environment
          command: |
            python3 -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
      - persist_to_workspace:
          root: ~/project
          paths:
            - venv  # Persist virtual environment
            - requirements.txt

  train_model:
    docker:
      - image: cimg/python:3.9 
    steps:
      - checkout
      - attach_workspace:
          at: ~/project
      - run:
          name: Activate Virtual Environment
          command: |
            . ~/project/venv/bin/activate
      - run:
          name: Train Model
          command: |
            cd ~/project
            python train.py  

            # Debug: List files in the expected output directory
            ls -l runs/train/exp/weights/

            # Move best.pt to the root directory
            mv runs/train/exp/weights/best.pt ./best.pt || { echo "Error: best.pt not found!"; exit 1; }

            # Debug: Verify best.pt exists
            if [ -f "./best.pt" ]; then
              echo "best.pt found in the root directory!"
            else
              echo "Error: best.pt not found in the root directory!"
              exit 1
            fi
      - persist_to_workspace:
          root: ~/project
          paths:
            - best.pt

  build_and_push_docker_image:
    executor: docker-executor  # Use machine executor for full Docker support
    steps:
      - checkout
      - attach_workspace:
          at: ~/project
      - run:
          name: Install Docker Buildx
          command: |
            mkdir -p ~/.docker/cli-plugins/
            curl -L https://github.com/docker/buildx/releases/latest/download/buildx-linux-arm64 -o ~/.docker/cli-plugins/docker-buildx
            chmod +x ~/.docker/cli-plugins/docker-buildx
            docker buildx version  # Verify installation
      - run:
          name: Enable Docker Buildx
          command: |
            docker buildx create --use --name mybuilder
            docker buildx inspect --bootstrap
      - run:
          name: Move Best Model to Docker Build Context
          command: |
            mkdir -p ~/project/model
            mv ~/project/best.pt ~/project/model/
      - run:
          name: Authenticate with Docker Hub
          command: |
            echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run:
          name: Build and Push Multi-Platform Docker Image (including Raspberry Pi)
          command: |
            docker buildx build --platform linux/amd64,linux/arm64,linux/arm/v7 \
              -t $DOCKERHUB_USERNAME/waste_detection:latest \
              --push .

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - clone_repository
      - setup_python_environment:
          requires:
            - clone_repository
      - train_model:
          requires:
            - setup_python_environment
      - build_and_push_docker_image:
          requires:
            - train_model
