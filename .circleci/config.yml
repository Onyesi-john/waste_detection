version: 2.1

executors:
  arm_executor:
    machine: true  # Enables privileged mode for QEMU multi-arch builds

jobs:
  clone_repository:
    docker:
      - image: cimg/python:3.9  # Use CircleCI’s Python image for AMD64 compatibility
    steps:
      - checkout

  setup_python_environment:
    docker:
      - image: cimg/python:3.9  # Use official CircleCI Python image (ARM64 not needed here)
    steps:
      - checkout
      - run:
          name: Set Up Python Environment
          command: |
            python3 -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

  train_model:
    docker:
      - image: cimg/python:3.9  # Use same Python image for consistency
    steps:
      - checkout
      - attach_workspace:
          at: ~/project
      - run:
          name: Install Python Dependencies
          command: |
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
      - run:
          name: Train Model
          command: |
            . venv/bin/activate
            python train.py

            

            # Move best.pt to the root directory
            if [ -f "waste_detection/exp/weights/best.pt" ]; then
              echo "✅ best.pt found! Moving it to project root."
              mv waste_detection/exp/weights/best.pt ./best.pt
            else
              echo "❌ Error: best.pt not found!"
              exit 1
            fi
      - persist_to_workspace:
          root: ~/project
          paths:
            - best.pt

  build_and_push_docker_image:
    executor: arm_executor
    steps:
      - checkout
      - attach_workspace:
          at: ~/project
      - run:
          name: Start Docker Service
          command: |
            sudo systemctl start docker
            sleep 5  # Give it a few seconds to fully start
      - run:
          name: Enable QEMU for Multi-Arch Builds
          command: |
            docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
      - run:
          name: Authenticate with Docker Hub
          command: |
            echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run:
          name: Build and Push Docker Image for Raspberry Pi
          command: |
            docker buildx create --use
            docker buildx build --platform linux/arm64 -t $DOCKERHUB_USERNAME/waste_detection:latest --push .

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - clone_repository
      - setup_python_environment:
          requires:
            - clone_repository
      - train_model:
          requires:
            - setup_python_environment
      - build_and_push_docker_image:
          requires:
            - train_model
