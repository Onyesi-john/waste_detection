version: 2.1

executors:
  arm_executor:
    machine: true  # Enables privileged mode for QEMU multi-arch builds

jobs:
  clone_repository:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout

  setup_python_environment:
    docker:
      - image: arm64v8/python:3.9  # Use ARM-compatible image
    steps:
      - checkout
      - run:
          name: Install System Dependencies
          command: |
            apt-get update && sudo apt-get install -y \
            libgl1-mesa-glx \
            libglib2.0-0 \
            ffmpeg \
            libsm6 \
            libxext6 \
            libxrender1
      - run:
          name: Set Up Python Environment
          command: |
            python3 -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

  train_model:
    docker:
      - image: arm64v8/python:3.9
    steps:
      - checkout
      - attach_workspace:
          at: ~/project
      - run:
          name: Install System Dependencies (For Training)
          command: |
            apt-get update && sudo apt-get install -y \
            libgl1-mesa-glx \
            libglib2.0-0 \
            ffmpeg \
            libsm6 \
            libxext6 \
            libxrender1
      - run:
          name: Install Python Dependencies for Training
          command: |
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
      - run:
          name: Train Model
          command: |
            . venv/bin/activate
            python train.py
      - persist_to_workspace:
          root: ~/project
          paths:
            - best.pt

  build_and_push_docker_image:
    executor: arm_executor
    steps:
      - checkout
      - attach_workspace:
          at: ~/project
      - setup_remote_docker
      - run:
          name: Enable QEMU for Multi-Arch Builds
          command: |
            docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
      - run:
          name: Authenticate with Docker Hub
          command: |
            echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run:
          name: Build and Push Docker Image for Raspberry Pi
          command: |
            docker buildx create --use
            docker buildx build --platform linux/arm64 -t $DOCKERHUB_USERNAME/waste_detection:latest --push .

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - clone_repository
      - setup_python_environment:
          requires:
            - clone_repository
      - train_model:
          requires:
            - setup_python_environment
      - build_and_push_docker_image:
          requires:
            - train_model
