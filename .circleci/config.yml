version: 2.1

executors:
  python-executor:
    docker:
      - image: circleci/python:3.8
    working_directory: ~/repo

  docker-executor:
    docker:
      - image: circleci/docker:latest
    working_directory: ~/repo
    environment:
      DOCKER_IMAGE: "latest"
      GITHUB_REGISTRY: "ghcr.io"
      GITHUB_REPO: "onyesi-john/waste_detection"

jobs:
  clone-repo:
    executor: python-executor
    steps:
      - checkout
      - run:
          name: Check out the correct branch
          command: git checkout dev-waste

  setup-python-env:
  executor: python-executor
  steps:
    - checkout
    - run:
        name: Set Up Python Environment
        command: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install gdown  # Install Google Drive downloader

    - run:
        name: Download and Extract Dataset
        command: |
          mkdir -p dataset
          if [ ! -d "dataset/valid" ]; then
            echo "Downloading dataset from Google Drive..."
            gdown --id 1BV-HLBtKluSgiwpPbAxv6Zh1lCAsZ1XO -O dataset.zip
            unzip dataset.zip -d dataset
            rm dataset.zip
          else
            echo "Dataset already exists. Skipping download."
          fi

    - run:
        name: Verify Dataset Path in `data.yaml`
        command: |
          if [ -f "dataset/data.yaml" ]; then
            echo "✅ data.yaml found!"
            cat dataset/data.yaml
          else
            echo "❌ Error: data.yaml not found!"
            exit 1
          fi

    - persist_to_workspace:
        root: ~/repo
        paths:
          - venv
          - dataset

  train-model:
    executor: python-executor
    steps:
      - checkout
      - attach_workspace:
          at: ~/repo
      - run:
          name: Train Model
          command: |
            source venv/bin/activate
            python train.py
            if [ -d "runs/detect" ]; then
              MODEL_DIR=$(ls -td runs/detect/train* 2>/dev/null | head -1)
              if [ -n "$MODEL_DIR" ]; then
                echo "Latest Model Directory: $MODEL_DIR"
                cp $MODEL_DIR/weights/best.pt ./best.pt || { echo "Error: best.pt not found!"; exit 1; }
              else
                echo "Error: No training directory found!"
                exit 1
              fi
            else
              echo "Error: runs/detect directory does not exist!"
              exit 1
            fi
            ls -lh ./best.pt
      - persist_to_workspace:
          root: ~/repo
          paths:
            - best.pt

  build-docker-image:
    executor: docker-executor
    steps:
      - checkout
      - attach_workspace:
          at: ~/repo
      - run:
          name: Build Docker Image
          command: |
            if [ ! -f "./best.pt" ]; then
              echo "Error: best.pt not found, training might have failed!"
              exit 1
            fi
            docker build -t ${GITHUB_REGISTRY}/${GITHUB_REPO}:${DOCKER_IMAGE} .

  push-to-ghcr:
    executor: docker-executor
    steps:
      - checkout
      - attach_workspace:
          at: ~/repo
      - run:
          name: Authenticate and Push Image
          command: |
            echo $GITHUB_TOKEN | docker login ghcr.io -u Onyesi-john --password-stdin
            docker push ghcr.io/onyesi-john/waste_detection:latest

  deploy-container:
    executor: docker-executor
    steps:
      - run:
          name: Deploy Container
          command: |
            docker stop yolo-app || true
            docker rm yolo-app || true
            docker pull ghcr.io/onyesi-john/waste_detection:latest
            docker run -d -p 5000:5000 --name yolo-app ghcr.io/onyesi-john/waste_detection:latest

workflows:
  version: 2
  build-and-deploy:
    jobs:
      - clone-repo
      - setup-python-env:
          requires:
            - clone-repo
      - train-model:
          requires:
            - setup-python-env
      - build-docker-image:
          requires:
            - train-model
      - push-to-ghcr:
          requires:
            - build-docker-image
      - deploy-container:
          requires:
            - push-to-ghcr
