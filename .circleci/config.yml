version: 2.1

jobs:
  clone_repository:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout

  setup_python_environment:
    docker:
      - image: cimg/python:3.9  
    steps:
      - checkout
      
      - run:
          name: Set Up Python Environment
          command: |
            apt-get update && apt-get install -y python3-venv  
            python3 -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

      - persist_to_workspace:
          root: .
          paths:
            - .

  train_model:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Install system dependencies
          command: |
            apt-get update && apt-get install -y \
              libgl1-mesa-glx \
              libglib2.0-0 \
              ffmpeg \
              libsm6 \
              libxrender1 \
              libxext6
      - run:
          name: Train Model
          command: |
            . venv/bin/activate
            python train.py

            
      - persist_to_workspace:
          root: .
          paths:
            - best.pt

  build_and_push_docker_image:
    docker:
      - image: docker:latest  
    steps:
      - checkout
      - attach_workspace:
          at: .
      - setup_remote_docker
      - run:
          name: Authenticate with Docker Hub
          command: |
            echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin 2>/dev/null || { echo "Docker login failed!"; exit 1; }
      - run:
          name: Build and Push Docker Image
          command: |
            docker build -t $DOCKERHUB_USERNAME/waste_detection:latest .
            docker images
            docker push $DOCKERHUB_USERNAME/waste_detection:latest

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - clone_repository
      - setup_python_environment:
          requires:
            - clone_repository
      - train_model:
          requires:
            - setup_python_environment
      - build_and_push_docker_image:
          requires:
            - train_model
