version: 2.1

jobs:
  clone_repository:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout

  setup_python_environment:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - run:
          name: Set Up Python Environment
          command: |
            apt-get update && apt-get install -y python3-venv
            python3 -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
      - persist_to_workspace:
          root: ~/project
          paths:
            - .  # Persist the entire workspace

  train_model:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - attach_workspace:
          at: ~/project
      - run:
          name: Train Model
          command: |
            . venv/bin/activate
            python train.py --data /home/circleci/project/data.yaml --weights yolov5s.pt --epochs 50
      - run:
          name: Ensure Best Model Exists
          command: |
            if [ ! -f /home/circleci/project/runs/train/exp/weights/best.pt ]; then
              echo "Training failed: best.pt not found!"
              exit 1
            fi
      - persist_to_workspace:
          root: ~/project
          paths:
            - runs/train/exp/weights/best.pt  # Persist only the model

  build_and_push_docker_image:
    docker:
      - image: docker:latest
    steps:
      - checkout
      - attach_workspace:
          at: ~/project
      - setup_remote_docker
      - run:
          name: Verify Model Exists Before Docker Build
          command: |
            if [ ! -f /home/circleci/project/runs/train/exp/weights/best.pt ]; then
              echo "Error: best.pt not found!"
              exit 1
            fi
      - run:
          name: Move Best Model to Docker Build Context
          command: |
            mkdir -p /home/circleci/project/docker_model
            cp /home/circleci/project/runs/train/exp/weights/best.pt /home/circleci/project/docker_model/
      - run:
          name: Build and Push Docker Image
          command: |
            docker build -t $DOCKERHUB_USERNAME/waste_detection:latest /home/circleci/project
            docker push $DOCKERHUB_USERNAME/waste_detection:latest

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - clone_repository
      - setup_python_environment:
          requires:
            - clone_repository
      - train_model:
          requires:
            - setup_python_environment
      - build_and_push_docker_image:
          requires:
            - train_model