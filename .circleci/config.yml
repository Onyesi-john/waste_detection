version: 2.1

jobs:
  clone_repository:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout

  setup_python_environment:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - run:
          name: Install System Dependencies
          command: |
            apt-get update && apt-get install -y \
            libgl1-mesa-glx \
            libglib2.0-0 \
            ffmpeg \
            libsm6 \
            libxext6 \
            libxrender1
      - run:
          name: Set Up Python Environment
          command: |
            python3 -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

  train_model:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - attach_workspace:
          at: ~/project
      - run:
          name: Install System Dependencies (For Training)
          command: |
            apt-get update && apt-get install -y \
            libgl1-mesa-glx \
            libglib2.0-0 \
            ffmpeg \
            libsm6 \
            libxext6 \
            libxrender1
      - run:
          name: Install Python Dependencies for Training
          command: |
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt  # Ensure ultralytics and other dependencies are installed
      - run:
          name: Train Model
          command: |
            . venv/bin/activate
            python train.py

            # Debug: List files in the runs/detect/train directory
            ls -l runs/detect/train

            # Move best.pt to the root directory
            mv runs/detect/train/weights/best.pt ./best.pt || { echo " Error: best.pt not found!"; exit 1; }

            # Debug: Verify best.pt exists in the root directory
            if [ -f "./best.pt" ]; then
              echo "best.pt found in the root directory!"
            else
              echo " Error: best.pt not found in the root directory!"
              exit 1
            fi
      - persist_to_workspace:
          root: ~/project
          paths:
            - best.pt

  build_and_push_docker_image:
    docker:
      - image: docker:latest
    steps:
      - checkout
      - attach_workspace:
          at: ~/project
      - setup_remote_docker
      - run:
          name: Authenticate with Docker Hub
          command: |
            echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin 2>/dev/null || { echo "Docker login failed!"; exit 1; }
      - run:
          name: Build and Push Docker Image
          command: |
            docker buildx build --platform linux/arm64,linux/amd64 -t $DOCKERHUB_USERNAME/waste_detection:latest .
            docker push $DOCKERHUB_USERNAME/waste_detection:latest

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - clone_repository
      - setup_python_environment:
          requires:
            - clone_repository
      - train_model:
          requires:
            - setup_python_environment
      - build_and_push_docker_image:
          requires:
            - train_model
