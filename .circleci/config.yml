version: 2.1

jobs:
  clone_repository:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - run:
          name: Switch to dev-waste branch
          command: git checkout dev-waste

  setup_python_environment:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - run:
          name: Switch to dev-waste branch
          command: git checkout dev-waste
      - run:
          name: Set Up Python Environment
          command: |
            python3 -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            pip install gdown  # Install gdown for downloading from Google Drive
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

  train_model:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - run:
          name: Switch to dev-waste branch
          command: git checkout dev-waste
      - attach_workspace:
          at: ~/project
      - run:
          name: Download Dataset from Google Drive
          command: |
            . venv/bin/activate
            gdown "https://drive.google.com/uc?id=11j4aV5SU5jRFsHHz3bSgJSN-16o1rIjy8" -O dataset.zip  # Use the direct download link
            file dataset.zip  # Debug: Check the file type
            ls -lh dataset.zip  # Debug: Check the file size
            unzip -o dataset.zip -d dataset  # Use -o to overwrite files without prompting
            rm dataset.zip  # Remove the zip file after extraction
      - run:
          name: Debug Dataset Directory
          command: |
            echo "Current Working Directory: $(pwd)"
            ls -R dataset  # Verify dataset structure
            cat dataset/data.yaml  # Verify data.yaml content
      - run:
          name: Train Model
          command: |
            . venv/bin/activate
            python train.py

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - clone_repository
      - setup_python_environment:
          requires:
            - clone_repository
      - train_model:
          requires:
            - setup_python_environment