version: 2.1

jobs:
  clone_repository:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout

  setup_python_environment:
    docker:
      - image: cimg/python:3.9  
    steps:
      - checkout
      
      - run:
          name: Set Up Python Environment
          command: |
            apt-get update && apt-get install -y python3-venv  
            python3 -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

      - persist_to_workspace:
          root: /home/john/waste_detection
          paths:
            - .

  train_model:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - attach_workspace:
          at: /home/john/waste_detection
      - run:
          name: Install system dependencies
          command: |
            apt-get update && apt-get install -y \
              libgl1-mesa-glx \
              libglib2.0-0 \
              ffmpeg \
              libsm6 \
              libxrender1 \
              libxext6
      - run:
          name: Create Directory and Train Model
          command: |
            mkdir -p /home/john/waste_detection
            cd /home/john/waste_detection
            . venv/bin/activate
            python train.py

            # Debug: List files in the runs/detect/train directory
            ls -l runs/detect/train

            # Move best.pt to the root directory
            mv runs/detect/train/weights/best.pt ./best.pt || { echo " Error: best.pt not found!"; exit 1; }

            # Debug: Verify best.pt exists in the root directory
            if [ -f "./best.pt" ]; then
              echo "best.pt found in the root directory!"
            else
              echo " Error: best.pt not found in the root directory!"
              exit 1
            fi
      - persist_to_workspace:
          root: /home/john/waste_detection
          paths:
            - best.pt

  build_and_push_docker_image:
    docker:
      - image: docker:latest  
    steps:
      - checkout
      - attach_workspace:
          at: /home/john/waste_detection
      - setup_remote_docker
      - run:
          name: Authenticate with Docker Hub
          command: |
            echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin 2>/dev/null || { echo "Docker login failed!"; exit 1; }
      - run:
          name: Build and Push Docker Image
          command: |
            cd /home/john/waste_detection
            docker build -t $DOCKERHUB_USERNAME/waste_detection:latest .
            docker images
            docker push $DOCKERHUB_USERNAME/waste_detection:latest

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - clone_repository
      - setup_python_environment:
          requires:
            - clone_repository
      - train_model:
          requires:
            - setup_python_environment
      - build_and_push_docker_image:
          requires:
            - train_model
