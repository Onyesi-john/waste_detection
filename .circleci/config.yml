version: 2.1

executors:
  python-executor:
    docker:
      - image: cimg/python:3.9
    working_directory: ~/project

jobs:
  clone_repository:
    executor: python-executor
    steps:
      - checkout

  setup_python_environment:
    executor: python-executor
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: |
            apt-get update && apt-get install -y python3-venv
            python3 -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
      - run:
          name: Clone YOLOv5 Repository
          command: |
            git clone https://github.com/ultralytics/yolov5.git
            cd yolov5
            pip install -r requirements.txt
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

  train_model:
    executor: python-executor
    steps:
      - checkout
      - attach_workspace:
          at: ~/project
      - run:
          name: Train YOLOv5 Model
          command: |
            . venv/bin/activate
            python train.py
      - run:
          name: Ensure Best Model Exists
          command: |
            if [ ! -f ~/project/runs/train/exp/weights/best.pt ]; then
              echo "Training failed: best.pt not found!"
              exit 1
            fi
      - persist_to_workspace:
          root: ~/project
          paths:
            - runs/train/exp/weights/best.pt

  build_and_push_docker_image:
    docker:
      - image: docker:latest
    steps:
      - checkout
      - attach_workspace:
          at: ~/project
      - setup_remote_docker:
          version: 20.10.7
          docker_layer_caching: true
      - run:
          name: Move Best Model to Docker Build Context
          command: |
            mkdir -p ~/project/docker_model
            cp ~/project/runs/train/exp/weights/best.pt ~/project/docker_model/
      - run:
          name: Build and Push Docker Image with Buildx
          command: |
            docker buildx create --use
            docker buildx inspect --bootstrap
            docker buildx build --platform linux/amd64,linux/arm64 -t $DOCKERHUB_USERNAME/waste_detection:latest --push ~/project

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - clone_repository
      - setup_python_environment:
          requires:
            - clone_repository
      - train_model:
          requires:
            - setup_python_environment
      - build_and_push_docker_image:
          requires:
            - train_model
