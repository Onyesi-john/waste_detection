version: 2.1

jobs:
  clone_repository:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - run:
          name: Switch to dev-waste branch
          command: git checkout dev-waste

  setup_python_environment:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - run:
          name: Switch to dev-waste branch
          command: git checkout dev-waste
      - run:
          name: Set Up Python Environment
          command: |
            python3 -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

  train_model:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - run:
          name: Switch to dev-waste branch
          command: git checkout dev-waste
      - attach_workspace:
          at: ~/project
      - run:
          name: Debug Dataset Directory
          command: |
            echo "Current Working Directory: $(pwd)"
            ls -R dataset  # Verify dataset structure

            # Ensure data.yaml is in the dataset folder
            if [ ! -f "dataset/data.yaml" ]; then
              echo "❌ data.yaml not found in dataset/. Moving it..."
              mv data.yaml dataset/data.yaml || { echo "❌ Failed to move data.yaml"; exit 1; }
            fi

            # Verify after moving
            ls -l dataset/
            cat dataset/data.yaml
      - run:
          name: Train Model
          command: |
            . venv/bin/activate
            python train.py

  build_and_push_docker_image:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - run:
          name: Switch to dev-waste branch
          command: git checkout dev-waste
      - attach_workspace:
          at: ~/project
      - setup_remote_docker
      - run:
          name: Verify Model File
          command: |
            if [ ! -f "./best.pt" ]; then
              echo "❌ Error: best.pt not found after training!"
              exit 1
            fi
      - run:
          name: Authenticate with Docker Hub
          command: |
            echo "DOCKERHUB_USERNAME: $DOCKERHUB_USERNAME"
            echo "DOCKERHUB_PASSWORD: $DOCKERHUB_PASSWORD"
            echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker info
      - run:
          name: Build and Push Docker Image
          command: |
            docker build -t $DOCKERHUB_USERNAME/waste_detection:latest .
            docker images
            docker push $DOCKERHUB_USERNAME/waste_detection:latest

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - clone_repository
      - setup_python_environment:
          requires:
            - clone_repository
      - train_model:
          requires:
            - setup_python_environment
      - build_and_push_docker_image:
          requires:
            - train_model