<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Waste Detection using YOLOv5</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <style>
        /* Add your custom CSS here */
        #photo {
            display: none; /* Hidden by default */
            height: 300px;
            width: 300px;
            padding: 5px;
        }
        #video {
            height: 300px;
            width: 300px;
            padding: 5px;
        }
        .res-part2 img {
            max-width: 100%;
            height: auto;
        }
        #loading {
            display: none; /* Hidden by default */
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.7);
            z-index: 9999;
        }
        .loader {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #3498db;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 2s linear infinite;
            position: absolute;
            top: 50%;
            left: 50%;
            margin-top: -30px;
            margin-left: -30px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <header class="bg-primary text-center py-5 mb-4">
        <div class="container">
            <h1 class="font-weight-light text-white">Waste Detection using YOLOv5</h1>
        </div>
    </header>

    <div class="container">
        <form class="input-group upload-data row">
            <div class="col-xl-6 col-md-6 col-sm-6">
                <button type="button" class="btn btn-primary col-12" id="uload">Upload</button>
            </div>
            <div class="col-xl-6 col-md-6 col-sm-6">
                <button id="send" type="button" class="btn btn-success col-12">Predict</button>
            </div>
            <div class="col-xl-6 col-md-6 col-sm-6">
                <button id="startLive" type="button" class="btn btn-info col-12">Start Live Detection</button>
            </div>
            <input type="hidden" class="form-control mr-2" id="url" value="http://localhost:5000/predict" />
            <input name="upload" type="file" id="fileinput" style="position:absolute;top:-500px; display: none;" />
        </form>

        <div class="row">
            <div class="col-xl-6 col-md-6 col-sm-6 mb-6">
                <div class="card border-0 shadow upload-image">
                    <video autoplay id="video" poster="https://via.placeholder.com/300"></video>
                    <img src="" id="photo">
                </div>
            </div>
            <div class="col-xl-6 col-md-6 col-sm-6 mb-6">
                <div class="card border-0 shadow res-part2">
                    <div class="card-body text-center">
                        <h5 class="card-title mb-0">Prediction Results</h5>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="loading">
        <div class="loader"></div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script>
        $(document).ready(function () {
            $("#loading").hide();

            // Start Webcam
            function startWebcam() {
                navigator.mediaDevices.getUserMedia({ video: true })
                    .then(function (stream) {
                        var video = document.getElementById('video');
                        video.srcObject = stream;
                        video.play();
                    })
                    .catch(function (err) {
                        console.error("Error accessing webcam: ", err);
                    });
            }

            // Start webcam on page load
            startWebcam();

            // Upload Image
            $('#uload').click(function () {
                $('#fileinput').click();
            });

            // Handle File Input
            $("#fileinput").change(function () {
                if (this.files && this.files[0]) {
                    var reader = new FileReader();
                    reader.onload = function (e) {
                        var url = e.target.result;
                        var img = new Image();
                        img.crossOrigin = 'Anonymous';
                        img.onload = function () {
                            var canvas = document.createElement('CANVAS');
                            var ctx = canvas.getContext('2d');
                            canvas.height = this.height;
                            canvas.width = this.width;
                            ctx.drawImage(this, 0, 0);
                            base_data = canvas.toDataURL('image/jpeg', 1.0).replace(/^data:image.+;base64,/, '');
                            canvas = null;
                        };
                        img.src = url;
                        $('#photo').attr('src', url);
                        $('#photo').show();
                        $('#video').hide();
                    };
                    reader.readAsDataURL(this.files[0]);
                }
            });

            // Predict Image
            $('#send').click(function () {
                sendRequest(base_data);
            });

            // Start Live Detection
            $('#startLive').click(function () {
                $.ajax({
                    url: 'http://localhost:5000/live',
                    type: 'GET',
                    success: function (response) {
                        alert(response.message); // Display the response from the server
                    },
                    error: function (err) {
                        console.error("Error starting live detection: ", err);
                    }
                });
            });

            // Send Request to Flask Backend
            function sendRequest(base64Data) {
                var url = $("#url").val();
                $("#loading").show();
                $.ajax({
                    url: url,
                    type: "POST",
                    cache: false,
                    async: true,
                    crossDomain: true,
                    headers: {
                        'Content-Type': 'application/json',
                        'Access-Control-Allow-Origin': '*'
                    },
                    data: JSON.stringify({
                        image: base64Data
                    }),
                    success: function (res) {
                        $(".res-part2").html("");
                        var imageData = res.image;
                        $(".res-part2").append("<img class='resp-img' src='data:image/jpeg;base64," + imageData + "' alt='' />");
                        $("#loading").hide();
                    },
                    error: function (xhr, status, error) {
                        $("#loading").hide();
                        alert("Error: " + error); // Display the error message
                    }
                });
            }
        });
    </script>
</body>

</html>
